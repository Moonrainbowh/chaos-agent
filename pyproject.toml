[build-system]
requires = ["setuptools>=77", "wheel", "packaging>=24.2"]
build-backend = "setuptools.build_meta"

[project]
name = "chaos-agent"
version = "1.0.3"
description = "Chaos Agent: a Windows-first, policy-gated open-source coding agent"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "lack"}]
dependencies = ["agent-client-protocol>=0.12,<0.13", "httpx>=0.28,<0.29", "mcp>=1.0,<2", "Pillow>=10,<12", "psutil>=5.9", "regex>=2024.0", "tomli>=2.0,<3", "tiktoken>=0.12,<1"]

[project.scripts]
chaos-agent = "code_agent_win.cli:main"
agent = "code_agent_win.cli:main"
chaos-agent-acp = "code_agent_win.acp_cli:main"

name: CI

on:
  push:
  pull_request:

jobs:
  windows:
    name: Windows Python 3.10
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install --upgrade pip "build>=1.2" "packaging>=24.2" "setuptools>=77" wheel
      - run: python -m pip install .
      - run: python scripts/run_tests.py
      - run: python -m build --no-isolation --outdir .ci-dist
      - run: >-
          python -m pip download --dest .ci-dist --only-binary=:all:
          "httpx>=0.28,<0.29" "mcp>=1.0,<2" "Pillow>=10,<12"
          "psutil>=5.9" "regex>=2024.0" "tomli>=2.0,<3"
      - run: python -m venv .ci-venv
      - run: .\.ci-venv\Scripts\python -m pip install --no-index --find-links .ci-dist chaos-agent
      - run: .\.ci-venv\Scripts\python -m pip check
      - run: .\.ci-venv\Scripts\python -c "import code_agent_win.app; import code_agent.verification.python_adapter"

  portable-core:
    name: ${{ matrix.os }} Python 3.10
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install --upgrade pip "packaging>=24.2"
      - run: python -m pip install .
      - run: python -m unittest discover -s src/code_agent/core/tests -p "test_*.py"
      - run: python -m unittest discover -s src/code_agent/context/tests -p "test_*.py"
      - run: python -m unittest discover -s src/code_agent/policy/tests -p "test_*.py"
      - run: python -m unittest discover -s src/code_agent/projects/tests -p "test_*.py"
      - run: python -m unittest discover -s src/code_agent/providers/tests -p "test_*.py"
      - run: python -m unittest discover -s src/code_agent/sessions/tests -p "test_*.py"
      - run: python -m unittest discover -s src/code_agent/verification/tests -p "test_*.py"
      - run: python -m unittest discover -s src/code_agent/workspace/tests -p "test_*.py"
      - run: python -m unittest discover -s src/code_agent/evaluation/tests -p "test_*.py"

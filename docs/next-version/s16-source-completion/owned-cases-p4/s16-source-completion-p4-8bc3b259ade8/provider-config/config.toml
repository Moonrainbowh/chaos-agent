[default]
provider="glm-5-3-flash"
[agent]
approval_mode="auto"
allow_sensitive_paths=false
[providers.glm-5-3-flash]
api="chat_completions"
base_url="http://127.0.0.1:7863"
model="glm-5.3-flash"
api_key_env="S16_REAL_MODEL_KEY"
context_window=1000000
timeout_s=60
max_retries=2
max_output_tokens=4096
max_agent_rounds=12
max_tool_calls=40
max_tool_calls_per_round=8
[providers.glm-5-3-flash.context_policy]
strategy="persistent"
work_tokens=1000000
task_tokens=1000000

name: CI

on:
  push:
  pull_request:

jobs:
  windows:
    name: Windows Python ${{ matrix.python-version }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install uv==0.12.13
      - run: uv sync --locked --group dev --python "${{ matrix.python-version }}"
      - run: uv run --locked python scripts/run_tests.py --suite-timeout 600
      - run: uv run --locked python -m build --no-isolation --outdir .ci-dist
      - run: uv export --locked --no-emit-project --no-dev --output-file .ci-dist/runtime-requirements.txt
      - run: >-
          python -m pip download --dest .ci-dist --only-binary=:all: --no-deps
          -r .ci-dist/runtime-requirements.txt
      - run: uv run --locked python -m build benchmarks --no-isolation --outdir .ci-bench-dist
      - run: python scripts/check_wheel_install.py --wheel (Get-ChildItem .ci-dist/chaos_agent-*.whl).FullName --wheelhouse .ci-dist --benchmark-wheel (Get-ChildItem .ci-bench-dist/chaos_agent_benchmarks-*.whl).FullName

  portable:
    name: ${{ matrix.os }} Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install uv==0.12.13
      - run: uv sync --locked --group dev --python "${{ matrix.python-version }}"
      - run: uv run --locked python -m compileall -q src chaos_agent
      - run: uv run --locked python scripts/run_tests.py --suite-timeout 600
      - run: uv run --locked python -m build --no-isolation --outdir .ci-dist
      - run: uv export --locked --no-emit-project --no-dev --output-file .ci-dist/runtime-requirements.txt
      - run: python -m pip download --dest .ci-dist --only-binary=:all: --no-deps -r .ci-dist/runtime-requirements.txt
      - run: uv run --locked python -m build benchmarks --no-isolation --outdir .ci-bench-dist
      - run: python scripts/check_wheel_install.py --wheel .ci-dist/chaos_agent-*.whl --wheelhouse .ci-dist --benchmark-wheel .ci-bench-dist/chaos_agent_benchmarks-*.whl

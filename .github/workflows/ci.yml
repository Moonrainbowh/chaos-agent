name: CI

on:
  push:
  pull_request:

jobs:
  windows:
    name: Windows Python ${{ matrix.python-version }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip "build>=1.2" "packaging>=24.2" "setuptools>=77" wheel
      - run: python -m pip install .
      - run: python scripts/run_tests.py --suite-timeout 600
      - run: python -m build --no-isolation --outdir .ci-dist
      - run: >-
          python -m pip download --dest .ci-dist --only-binary=:all:
          "agent-client-protocol>=0.12,<0.13" "tiktoken>=0.12,<1"
          "httpx>=0.28,<0.29" "mcp>=1.0,<2" "Pillow>=10,<12"
          "psutil>=5.9" "regex>=2024.0" "tomli>=2.0,<3"
      - run: python -m venv .ci-venv
      - run: .\.ci-venv\Scripts\python -m pip install --no-index --find-links .ci-dist chaos-agent
      - run: .\.ci-venv\Scripts\python -m pip check
      - run: .\.ci-venv\Scripts\python -c "import code_agent_win.app; import code_agent.verification.python_adapter"

  portable:
    name: ${{ matrix.os }} Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip "build>=1.2" "packaging>=24.2" "setuptools>=77" wheel
      - run: python -m pip install .
      - run: python -m compileall -q src code_agent_win
      - run: python scripts/run_tests.py --suite-timeout 600

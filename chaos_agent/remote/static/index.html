<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#151b25">
<title>Chaos Agent</title>
<style>
:root{color-scheme:dark;--bg:#11151b;--panel:#181e28;--line:#2c3543;--text:#e8edf5;--muted:#96a4b7;--accent:#81d7b0}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,sans-serif;overflow:hidden}button,input,textarea{font:inherit}button{cursor:pointer;min-height:40px;border:0;border-radius:7px;padding:8px 12px;background:var(--panel);color:var(--text)}button:disabled{opacity:.45;cursor:default}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}[hidden]{display:none!important}
main{width:100%;max-width:620px;margin:auto;height:100vh;height:100dvh;padding-top:env(safe-area-inset-top);display:flex;flex-direction:column;overflow:hidden}.app-header{min-height:54px;display:flex;gap:12px;align-items:center;padding:7px 14px;border-bottom:1px solid var(--line)}h1{font-size:16px;letter-spacing:.02em;margin:0;flex:1}.muted{color:var(--muted);font-size:12px}#state{white-space:nowrap;font-size:11px}#pair{padding:14px;display:flex;gap:8px}input,textarea{min-width:0;background:#111720;color:var(--text);border:1px solid var(--line);border-radius:7px;padding:10px;font-size:16px}#token{flex:1}.primary{background:var(--accent);color:#0c2118;font-weight:600}.notice{margin:0;padding:9px 14px;font-size:12px;color:#dbc391;background:#29251d;border-bottom:1px solid #443b2b}.active-banner{padding:5px 10px 5px 14px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);background:#1b2926;font-size:12px}.active-banner span{flex:1}.active-banner button{color:var(--accent);background:transparent;padding:6px 8px}
.screen{min-height:0;flex:1;display:flex;flex-direction:column}.navline{display:flex;align-items:center;gap:5px;padding:5px 10px;border-bottom:1px solid var(--line)}.tabs{display:flex;gap:4px;flex:1}.tabs button{background:transparent;color:var(--muted);padding:8px 15px}.tabs button[aria-selected=true]{color:var(--text);background:#283343}.icon-button{width:40px;padding:5px;background:transparent;font-size:20px}.identity{flex:1;min-width:0}.identity strong{display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:14px;font-weight:600}.identity small{display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:11px;color:var(--muted)}#newSession{font-size:12px;white-space:nowrap}.searchbar{padding:8px 14px;border-bottom:1px solid var(--line)}#search{width:100%;min-height:40px;padding:8px 10px}.scroll{min-height:0;flex:1;overflow-y:auto;overscroll-behavior:contain}.row{display:block;width:100%;min-height:68px;padding:10px 14px;border-radius:0;border-bottom:1px solid var(--line);background:transparent;text-align:left}.row:hover{background:#1b2430}.row-title{display:block;font-weight:600;font-size:14px;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}.row-preview{display:block;font-size:12px;color:#b0bdce;white-space:nowrap;text-overflow:ellipsis;overflow:hidden;margin:2px 0}.row-meta{display:block;color:var(--muted);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.empty{padding:40px 20px;text-align:center;color:var(--muted);font-size:13px}.more{display:block;margin:8px auto 14px;background:transparent;color:var(--accent);font-size:12px;min-width:120px}
.chat-header{padding:5px 10px;gap:5px}#chatState{font-size:11px;white-space:nowrap;max-width:110px;overflow:hidden;text-overflow:ellipsis}.messages{padding:12px 14px 18px;display:flex;flex-direction:column;gap:10px}.bubble{padding:9px 11px;border-radius:10px;max-width:94%;min-width:0;overflow-wrap:anywhere;white-space:pre-wrap;line-height:1.65;font-size:14px}.user{align-self:flex-end;background:#244a50;max-width:88%}.agent{align-self:flex-start;background:#1f2937;white-space:normal}.agent p{margin:0 0 8px;white-space:pre-wrap}.agent p:last-child{margin-bottom:0}.agent ul,.agent ol{margin:7px 0;padding-left:21px}.agent li{white-space:pre-wrap}.agent h2,.agent h3,.agent h4{margin:9px 0;font-size:1.08em}.agent code{font:.9em ui-monospace,monospace;background:#11151b;border-radius:4px;padding:2px 4px}.agent pre{max-width:100%;overflow:auto;padding:10px;border-radius:7px;background:#11151b;white-space:pre}.agent pre code{padding:0;background:none}#earlier{margin-bottom:0}.composer{display:flex;gap:7px;align-items:flex-end;padding:9px 12px calc(9px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--bg)}.composer textarea{flex:1;resize:none;min-height:44px;max-height:140px;line-height:1.4;padding:10px;font-size:16px}.composer button{min-width:48px;min-height:44px;padding:8px 10px}.stop{background:#df8a86;color:#231212}.catalog-footer{height:env(safe-area-inset-bottom);flex-shrink:0}#connectionHint{font-size:11px;color:var(--muted);padding:12px 14px}
@media(min-width:620px){main{border-left:1px solid var(--line);border-right:1px solid var(--line)}}@media(max-width:350px){.app-header,.searchbar,.row{padding-left:10px;padding-right:10px}.messages{padding-left:10px;padding-right:10px}.bubble{max-width:98%}.composer{padding-left:8px;padding-right:8px}}
</style>
<style>
:root{--bg:#181a1b;--panel:#222626;--line:#343a39;--text:#e7ece9;--muted:#9ba9a3;--accent:#83d4b6}
main{position:relative}.app-header h1{font-family:Consolas,"SFMono-Regular",monospace;letter-spacing:.04em}.user{background:#1c3c33;align-self:stretch;max-width:100%;border-left:3px solid #71b79b;border-radius:5px}.agent{background:transparent;max-width:100%;padding-left:0}.messages{gap:18px;padding-top:18px}.tabs button[aria-selected=true]{background:#293b34}.row:hover{background:#222e28}
.chat-header{flex-wrap:wrap}.chat-header .identity{min-width:130px}.header-actions{display:flex;gap:4px}.header-actions button{font-size:12px;min-height:44px;color:var(--accent)}
.mobile-actions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;padding:5px 10px calc(7px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#1c2020}.mobile-actions button{min-height:52px;border-radius:5px;padding:3px;font-size:12px}.mobile-actions span{display:block;font-size:19px;color:var(--accent);line-height:1.4}.composer{padding-bottom:9px}.project-tools{display:flex;gap:8px;padding:9px 14px;border-bottom:1px solid var(--line)}.project-tools button{min-height:44px}.project-tools small{margin:auto 0;color:var(--muted);font-size:11px}
.project-manager{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;background:var(--bg);padding-top:env(safe-area-inset-top)}.manager-header{display:flex;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}.manager-header strong{flex:1}.manager-header button{min-height:44px}.manager-form{padding:14px;display:flex;flex-wrap:wrap;gap:8px}.manager-form label{width:100%;color:var(--muted);font-size:12px}.manager-form input{width:100%}.manager-form button{min-height:44px}.manager-path{padding:0 14px 10px;overflow-wrap:anywhere;color:var(--muted);font:12px/1.6 Consolas,monospace}.manager-error{padding:0 14px;color:#e5b59a}.manager-footer{padding:10px 14px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;gap:8px}.manager-footer button{flex:1;min-height:44px}.manage-row{display:flex;border-bottom:1px solid var(--line)}.manage-row .row{border:0;min-width:0;flex:1}.manage-row>button:last-child{margin:auto 10px;min-height:44px;flex-shrink:0;color:#e5b59a}.manager-confirm{padding:14px;background:#2b2721;border-top:1px solid #554936}.manager-confirm p{margin:0 0 12px;overflow-wrap:anywhere}.manager-confirm button{min-height:44px;margin-right:8px}
@media(max-width:350px){.header-actions{width:100%}.header-actions button{flex:1}.project-tools small{display:none}}
</style>
<style>
.requests{padding:10px 14px;border-bottom:1px solid var(--line)}.request-card{padding:12px;margin:8px 0;background:var(--panel);border:1px solid var(--line);border-radius:7px;overflow-wrap:anywhere}.request-card p{margin:6px 0;white-space:pre-wrap}.request-card small{display:block;color:var(--muted);white-space:pre-wrap}.request-card button{min-height:44px;margin:8px 8px 0 0}.request-card textarea{display:block;width:100%;margin-top:8px;min-height:60px}.request-controls{display:flex;gap:8px;flex-wrap:wrap}
</style>
</head>
<body>
<main id="app">
<header class="app-header"><h1>Chaos Agent</h1><span id="state" class="muted" role="status">未配对</span></header>
<section id="pair"><input id="token" placeholder="输入电脑端 Token" aria-label="配对 Token" autocomplete="off"><button id="pairButton" class="primary">配对</button></section>
<p id="notice" class="notice" role="status" hidden></p>
<div id="activeBanner" class="active-banner" hidden><span id="activeText">另一个会话正在执行</span><button id="viewActive">查看任务 →</button></div>
<section id="catalogScreen" class="screen" hidden>
  <div id="homeNav" class="navline"><nav class="tabs" aria-label="导航"><button id="recentTab" aria-selected="true">最近</button><button id="projectsTab" aria-selected="false">项目</button></nav></div>
  <div id="projectTools" class="project-tools" hidden><button id="addProject" class="primary">＋ 添加项目</button><button id="manageProjects">管理</button><small>与 SSH 共用项目目录</small></div>
  <div id="projectNav" class="navline" hidden><button id="projectBack" class="icon-button" aria-label="返回项目列表">‹</button><div class="identity"><strong id="projectTitle"></strong><small id="projectSubtitle"></small></div><button id="newSession" class="primary">新建会话</button></div>
  <div class="searchbar"><input id="search" type="search" placeholder="搜索会话与历史内容" aria-label="搜索会话与历史内容" autocomplete="off"></div>
  <div class="scroll" id="catalogScroll"><div id="list" role="list"></div><p id="emptyList" class="empty" hidden></p><button id="loadMore" class="more" hidden>加载更多会话</button></div>
  <div class="catalog-footer"></div>
</section>
<section id="chatScreen" class="screen" hidden>
  <header class="navline chat-header"><button id="chatBack" class="icon-button" aria-label="返回会话列表">‹</button><div class="identity"><strong id="chatTitle">会话</strong><small id="chatProject"></small></div><div class="header-actions"><button id="chatProjects">项目</button><button id="chatSessions">会话</button></div><span id="chatState" class="muted" role="status"></span></header>
  <div id="timeline" class="scroll"><section id="requestsPanel" class="requests" aria-label="审批与决定" hidden><strong>审批与决定</strong><div id="requestRows" aria-live="polite"></div><button id="refreshRequests" type="button">刷新待办</button></section><button id="earlier" class="more" hidden>查看更早消息</button><section id="messages" class="messages" aria-label="聊天消息" aria-live="polite"></section></div>
  <form id="composer" class="composer"><textarea id="prompt" rows="1" maxlength="1024" placeholder="输入任务……" aria-label="输入任务"></textarea><button id="send" class="primary" type="submit">发送</button><button id="stop" class="stop" type="button" hidden>停止</button></form>
  <nav class="mobile-actions" aria-label="聊天操作"><button id="focusInput"><span aria-hidden="true">✎</span>输入</button><button id="actionSessions"><span aria-hidden="true">☰</span>会话</button><button id="latest"><span aria-hidden="true">↓</span>到底</button><button id="taskAction"><span id="taskActionIcon" aria-hidden="true">≡</span><b id="taskActionLabel">状态</b></button></nav>
</section>
<section id="projectManager" class="project-manager" role="dialog" aria-modal="true" aria-label="项目入口管理" hidden>
  <header class="manager-header"><strong id="managerTitle">添加项目</strong><button id="closeManager">完成</button></header>
  <form id="managerForm" class="manager-form"><label for="projectPath">电脑上的项目文件夹</label><input id="projectPath" placeholder="绝对路径，例如 F:\\my-project" autocomplete="off"><button id="saveProject" class="primary" type="submit">添加项目</button><button id="browseProjects" type="button">浏览文件夹</button></form>
  <p id="managerPath" class="manager-path"></p><p id="managerError" class="manager-error" role="status" hidden></p>
  <div id="directoryList" class="scroll" role="list"></div>
  <div id="removeConfirm" class="manager-confirm" hidden><p id="removeText"></p><button id="cancelRemove">取消</button><button id="confirmRemove">移除入口</button></div>
  <footer id="browseFooter" class="manager-footer" hidden><button id="browseParent">上一级</button><button id="chooseDirectory" class="primary">选此文件夹</button></footer>
</section>
<div id="connectionHint">配对后可查看项目和已有会话。</div>
</main>
<script>
const $=id=>document.querySelector('#'+id),state=$('state'),messages=$('messages'),token=$('token'),timeline=$('timeline');
const activeStatus=status=>['created','running','verifying'].includes(status),statusText=status=>({created:'执行中',running:'执行中',verifying:'验证中',completed:'已完成',accepted_partial:'已接受部分',waiting_decision:'待决策',failed:'失败',stopped:'已停止',interrupted:'已中断'}[status]||'可继续');
let credential=localStorage.getItem('chaos-device'),task=null,cursorTask=null,socket=null,lastSequence=0,reconnectTimer=null,hostEpoch=null;
let screen='home',tab='recent',selectedProjectId=null,selectedSessionId=null,selectedSummary=null,selectedResult=null,projects=[],sessions=[],nextOffset=null,nextBefore=null;
let globalRun={status:'idle',task_id:null,session_id:null,sequence:0},initialized=false,viewEpoch=0,listEpoch=0,historyRevision=0,historyJob=null,historyPending=false,syncJob=null,sending=false,searchTimer=null;
let records=[],nodes=new Map(),assistantBubble=null,assistantRecord=null,assistantText='',liveIndex=0;
let requestCards=[],requestTask=null,requestEpoch=0,requestBusy=false;
const decisionLabel=card=>card.preview?.operation==='reconcile'?({operator_executed:'报告已执行',operator_not_executed:'报告未执行',durable_receipt:'核验持久回执',local_mutation:'核验本机修改'}[card.preview?.reconciliation?.decision]||'核对结果'):({continue:'继续原任务',accept_partial:'接受部分交付',stop:'停止原任务'}[card.preview?.operation]||'批准一次');
function renderRequests(){
  const rows=$('requestRows');rows.replaceChildren();$('requestsPanel').hidden=screen!=='chat'||requestCards.length===0;
  for(const card of requestCards.slice(0,12)){
    const box=document.createElement('article');box.className='request-card';const title=document.createElement('strong');title.textContent=card.kind==='decision'?'任务决定':'动作审批';
    const text=document.createElement('p');text.textContent=String(card.preview?.summary||card.preview?.operation||'待核对请求');
    const meta=document.createElement('small');meta.textContent='工作区：'+String(card.workspace_root||'未知')+'\n有效期：'+new Date(card.expires_at*1000).toLocaleString()+'\n状态：'+({pending:'待响应',approved:'已处理',denied:'已拒绝',expired:'已过期',stale:'已失效'}[card.status]||card.status);
    box.append(title,text,meta);if(card.preview?.notice){const note=document.createElement('small');note.textContent=card.preview.notice;box.append(note)}
    if(card.status==='pending'&&Date.now()<card.expires_at*1000){
      let reason=null,evidence=null;if(card.preview?.operation==='reconcile'){reason=document.createElement('textarea');reason.maxLength=1024;reason.placeholder='核对理由';reason.setAttribute('aria-label','核对理由');evidence=document.createElement('textarea');evidence.maxLength=4096;evidence.placeholder='证据或具体观测；用户报告不代表已验证';evidence.setAttribute('aria-label','核对证据');box.append(reason,evidence)}
      const controls=document.createElement('div');controls.className='request-controls';const deny=document.createElement('button'),allow=document.createElement('button');deny.textContent='拒绝';allow.textContent=decisionLabel(card);allow.className='primary';deny.disabled=allow.disabled=requestBusy;
      deny.onclick=()=>void respondCard(card,false);allow.onclick=()=>void respondCard(card,true,reason?.value,evidence?.value);controls.append(deny,allow);box.append(controls);
    }
    rows.append(box);
  }
}
async function loadRequests(){
  const id=selectedSessionId,epoch=viewEpoch,revision=++requestEpoch;if(!credential||screen!=='chat'||!id)return;
  if(readOnlyReason()){requestCards=[];requestTask=null;renderRequests();return}
  try{const data=await api('/sessions/'+encodeURIComponent(id)+'/requests');if(id!==selectedSessionId||epoch!==viewEpoch||revision!==requestEpoch)return;requestTask=data.task_id;requestCards=Array.isArray(data.requests)?data.requests:[];renderRequests()}
  catch(error){if(id===selectedSessionId&&epoch===viewEpoch&&revision===requestEpoch&&credential){requestCards=[];renderRequests();notice('待办暂不可用：'+error.message)}}
}
async function respondCard(card,approved,reason,evidence){
  if(requestBusy||card.task_id!==requestTask||!requestCards.some(item=>item.request_id===card.request_id))return;
  if(approved&&card.preview?.operation==='reconcile'&&(!reason?.trim()||!evidence?.trim())){notice('请填写核对理由和证据；此操作不会自动续跑');return}
  const id=selectedSessionId,epoch=viewEpoch;requestBusy=true;renderRequests();
  const body={action_digest:card.action_digest,state_version:card.state_version,owner_instance_id:card.owner_instance_id,approved};if(approved&&card.preview?.operation==='reconcile'){body.reason=reason;body.evidence=evidence}
  try{await api('/tasks/'+encodeURIComponent(card.task_id)+'/requests/'+encodeURIComponent(card.request_id)+'/respond',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});if(id===selectedSessionId&&epoch===viewEpoch){notice(approved?'已记录响应；执行与验证结果以任务状态为准':'已拒绝');await loadHistory();await loadRequests()}}
  catch(error){if(id===selectedSessionId&&epoch===viewEpoch&&credential){notice(error.message);await loadRequests()}}
  finally{requestBusy=false;renderRequests()}
}
$('refreshRequests').onclick=()=>void loadRequests();
let drafts={};try{const saved=JSON.parse(localStorage.getItem('chaos-drafts-v1')||'{}');if(saved&&typeof saved==='object'&&!Array.isArray(saved))drafts=saved}catch{}
function draftKey(){return selectedSessionId?'session:'+selectedSessionId:selectedProjectId?'project:'+selectedProjectId:null}
function persistDrafts(){try{localStorage.setItem('chaos-drafts-v1',JSON.stringify(drafts))}catch{notice('草稿暂存于当前页面；浏览器存储不可用')}}
function saveDraft(){if(screen!=='chat')return;const key=draftKey();if(!key)return;const value=$('prompt').value;if(value)drafts[key]=value.slice(0,1024);else delete drafts[key];const keys=Object.keys(drafts);for(const old of keys.slice(0,Math.max(0,keys.length-64)))delete drafts[old];persistDrafts()}
function restoreDraft(){const value=drafts[draftKey()];$('prompt').value=typeof value==='string'?value.slice(0,1024):'';resizePrompt()}
function resizePrompt(){const input=$('prompt');input.style.height='auto';input.style.height=Math.min(140,input.scrollHeight)+'px'}
let savedSelection=null;try{savedSelection=JSON.parse(localStorage.getItem('chaos-selection')||'null')}catch{}
function remember(){localStorage.setItem('chaos-selection',JSON.stringify({screen,tab,project_id:selectedProjectId,session_id:selectedSessionId}))}
function notice(text=''){const el=$('notice');el.textContent=text;el.hidden=!text}
function relativeTime(value){if(!value)return'';const date=new Date(typeof value==='number'?(value<1e12?value*1000:value):value),elapsed=Math.max(0,Date.now()-date.getTime());if(!Number.isFinite(elapsed))return'';if(elapsed<60000)return'刚刚';if(elapsed<3600000)return Math.floor(elapsed/60000)+' 分钟前';if(elapsed<86400000)return Math.floor(elapsed/3600000)+' 小时前';if(elapsed<604800000)return Math.floor(elapsed/86400000)+' 天前';return date.toLocaleDateString('zh-CN',{month:'numeric',day:'numeric'})}
function closeSocket(){const old=socket;socket=null;if(old)old.close()}
function finishAssistant(){assistantBubble=null;assistantRecord=null;assistantText=''}
function atBottom(){return timeline.scrollHeight-timeline.scrollTop-timeline.clientHeight<80}
function scrollBottom(){timeline.scrollTop=timeline.scrollHeight}
function inlineText(parent,text){
  for(const part of text.split(/(`[^`\n]+`|\*\*[^*\n]+\*\*)/g)){
    if(part.startsWith('`')&&part.endsWith('`')&&part.length>2){const code=document.createElement('code');code.textContent=part.slice(1,-1);parent.append(code)}
    else if(part.startsWith('**')&&part.endsWith('**')&&part.length>4){const strong=document.createElement('strong');strong.textContent=part.slice(2,-2);parent.append(strong)}
    else parent.append(document.createTextNode(part));
  }
}
function renderReply(target,text){
  const blocks=[];let paragraph=[],list=null,code=null,codeLines=[];
  const flush=()=>{if(paragraph.length){const p=document.createElement('p');inlineText(p,paragraph.join('\n'));blocks.push(p);paragraph=[]}};
  for(const line of text.split('\n')){
    if(/^\s*```/.test(line)){flush();list=null;if(code)code=null;else{const pre=document.createElement('pre');code=document.createElement('code');codeLines=[];pre.append(code);blocks.push(pre)}continue}
    if(code){codeLines.push(line);code.textContent=codeLines.join('\n');continue}
    const heading=line.match(/^(#{1,6})\s+(.+)$/),item=line.match(/^\s*(?:([-*+])|\d+[.)])\s+(.+)$/);
    if(heading){flush();list=null;const h=document.createElement('h'+Math.min(heading[1].length+1,4));inlineText(h,heading[2]);blocks.push(h)}
    else if(item){flush();const kind=item[1]?'ul':'ol';if(!list||list.tagName.toLowerCase()!==kind){list=document.createElement(kind);blocks.push(list)}const li=document.createElement('li');inlineText(li,item[2]);list.append(li)}
    else if(!line.trim()){flush();list=null}else{list=null;paragraph.push(line)}
  }
  flush();target.replaceChildren(...blocks);
}
function messageNode(record){const el=document.createElement('div');el.className='bubble '+(record.role==='user'?'user':'agent');el.dataset.key=record.key;if(record.role==='assistant')renderReply(el,record.content);else el.textContent=record.content;return el}
function renderMessages(){nodes=new Map();messages.replaceChildren(...records.map(record=>{const node=messageNode(record);nodes.set(record.key,node);return node}));if(assistantRecord)assistantBubble=nodes.get(assistantRecord.key)||null;$('earlier').hidden=nextBefore==null}
function appendAssistant(text){if(typeof text!=='string'||!text)return;const follow=atBottom();if(!assistantRecord){assistantRecord={key:'live:'+cursorTask+':'+(++liveIndex),role:'assistant',content:''};records.push(assistantRecord);assistantBubble=messageNode(assistantRecord);nodes.set(assistantRecord.key,assistantBubble);messages.append(assistantBubble);assistantText=''}assistantText+=text;assistantRecord.content=assistantText;renderReply(assistantBubble,assistantText);if(follow)scrollBottom()}

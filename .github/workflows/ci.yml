name: CI

on:
  push:
  pull_request:

jobs:
  windows:
    name: Windows Python 3.10
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install .
      - run: python -m unittest discover -s src\code_agent\core\tests -p "test_*.py"
      - run: python -m unittest discover -s src\code_agent\context\tests -p "test_*.py"
      - run: python -m unittest discover -s src\code_agent\interfaces\tests -p "test_*.py"
      - run: python -m unittest discover -s src\code_agent\policy\tests -p "test_*.py"
      - run: python -m unittest discover -s src\code_agent\providers\tests -p "test_*.py"
      - run: python -m unittest discover -s src\code_agent\runtime\tests -p "test_*.py"
      - run: python -m unittest discover -s src\code_agent\sessions\tests -p "test_*.py"
      - run: python -m unittest discover -s src\code_agent\workspace\tests -p "test_*.py"
      - run: python -m unittest discover -s tests -p "test_*.py"

  portable-core:
    name: ${{ matrix.os }} Python 3.10
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install .
      - run: python -m unittest discover -s src/code_agent/core/tests -p "test_*.py"
      - run: python -m unittest discover -s src/code_agent/context/tests -p "test_*.py"
      - run: python -m unittest discover -s src/code_agent/policy/tests -p "test_*.py"
      - run: python -m unittest discover -s src/code_agent/providers/tests -p "test_*.py"
      - run: python -m unittest discover -s src/code_agent/sessions/tests -p "test_*.py"
      - run: python -m unittest discover -s src/code_agent/workspace/tests -p "test_*.py"

[build-system]
requires = ["setuptools>=77", "wheel", "packaging>=24.2"]
build-backend = "setuptools.build_meta"

[project]
name = "chaos-agent"
version = "1.0.3"
description = "Chaos Agent: a cross-platform, policy-gated open-source coding agent"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "lack"}]
dependencies = ["agent-client-protocol>=0.12,<0.13", "httpx>=0.28,<0.29", "mcp==1.29.1", "jsonschema>=4.26,<5", "referencing>=0.37,<0.38", "Pillow>=10,<12", "psutil>=5.9", "regex>=2024.0", "starlette>=0.46,<1", "tomli>=2.0,<3", "tiktoken>=0.12,<1", "uvicorn>=0.30,<1", "websockets>=14,<17"]

[dependency-groups]
dev = ["build>=1.2", "setuptools>=77", "wheel"]

[project.scripts]
chaos-agent = "chaos_agent.bootstrap:main"
chaos-mobile = "chaos_agent.mobile_cli:main"
agent = "chaos_agent.bootstrap:main"
chaos-agent-acp = "chaos_agent.acp_cli:main"

[tool.setuptools.package-data]
"code_agent.authentication" = ["catalog_seed.json"]
"code_agent.providers" = ["URI_AGENT_LICENSE.txt"]
